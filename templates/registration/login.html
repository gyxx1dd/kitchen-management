{% extends "base.html" %}

{% block css %}
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/login.css' %}">
{% endblock %}

{% block content %}
  <div class="login-container">
    <h1>Login</h1>
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      {{ form }}
      <input type="submit" value="Login">
    </form>
  </div>
{% endblock %}
