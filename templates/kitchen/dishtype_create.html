{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load static %}

{% block content %}
  <div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">

        <h1 class="mb-4">{{ object|yesno:"Update,Create" }} dish type</h1>

        <form method="post">
          {% csrf_token %}

          {{ form|crispy }}

          <button type="submit" class="btn btn-danger mt-3">
            {{ object|yesno:"Update,Create" }}
          </button>
        </form>

      </div>
    </div>
  </div>
{% endblock %}
{% block footer %}
{% endblock %}
